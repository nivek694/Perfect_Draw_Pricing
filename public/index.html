<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>EP Calculater.</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #counter {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        #wrap {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>

<body>

    <div id="baseLayer">

        <!--Buttons for adding effects and calculating costing-->
        <div>
            <button id="calculateButton">Calculate</button>
            <button id="addEffectButton">Add Effect</button>
        </div>

        <div id="wrap">
            <label for = "Card Name">Card Name:</label>
            <input type="text" id = "Card Name">

        </div>



        <!--Display final costing-->
        <div id="wrap">
            Total EP cost:
            <span id="finalCost">0/0</span>

        </div>

        <!--Identify which of the types of cards is being made-->

        <!--Find card strength-->
        <div id="wrap">
            <center>Card Strength</center><br>
            <input type="radio" id="weak" name="card_strength" value="weak" checked>
            <label for="weak">weak</label>
            <input type="radio" id="normal" name="card_strength" value="normal">
            <label for="normal">normal</label>
            <input type="radio" id="strong" name="card_strength" value="strong">
            <label for="strong">strong</label>
        </div>

        <!--Find card type-->
        <div id="wrap">
            <center>Card Type</center>
            <input type="radio" id="warrior" name="card_type" value="warrior" checked>
            <label for="warrior">warrior</label>
            <input type="radio" id="item" name="card_type" value="item">
            <label for="item">item</label>
            <input type="radio" id="invocation" name="card_type" value="invocation">
            <label for="invocation">invocation</label>
        </div>
        <!--Find if the card is an Ace and/or is in Gimmick-->
        <div id="wrap">
            <center>Other</center>
            <input type="checkbox" id="gimmick" value="gimmick">
            <label for="gimmick">gimmick</label>
            <input type="checkbox" id="ace" value="ace">
            <label for="ace">ace</label>
        </div>

        <!--Find card weakness value-->


        <!-- This has been depricated. This is now in effects
        <div id="wrap">
            <center>Weakness</center>
            <input type="radio" id="no_weakness" name="weakness" value="no_weakness" checked>
            <label for="no_weakness">no weakness</label>
            <input type="radio" id="weakness" name="weakness" value="weakness">
            <label for="weakness">weakness</label>
            <input type="radio" id="sig_weakness" name="weakness" value="sig_weakness">
            <label for="sig_weakness">sig weakness</label>
        </div>

        -->


    </div>




    <script>
        let ep_budget = 3; //Default EP budget of a card. Is updated after calculate is pressed
        const display = document.getElementById('counter');
        const calculateButton = document.getElementById('calculateButton'); //Button that is used to update the EP counter
        const addEffectButton = document.getElementById("addEffectButton"); //Adds a new effect when button is pressed.
        
        
        //const incrementer = document.getElementById("counter_increment");
        
        //Constants used for communication with getEpBudget
        const INVOCATION = "invocation";
        const ITEM = "item";
        const WARRIOR = "warrior";
        const STRONG = "strong";
        const NORMAL = "normal";
        const WEAK = "weak";
        const NO_WEAKNESS = "no_weakness"
        const WEAKNESS = "weakness"
        const SIG_WEAKNESS = "sig_weakness"
        var labelNumber = 0; //Used for making a unique RadioButton group for each effect.





        /**
         * Returns the ammount of EP that a given card will have access to.
         *@returns {number} the amount of EP that is avalible
         */
        function getEpBudget({ strength, type, weakness, sigWeakness, gimmick, ace }) {
            current_ep = 0;
            //Get 1 EP from gimmick
            if (gimmick) {
                current_ep += 1;
            }
            //Get IEP from Ace
            if (ace) {
                current_ep += 1
            }

            //Calculate EP from weakness
            /*
            if (weakness == WEAKNESS) {
                current_ep += 1;
            } else if (weakness == SIG_WEAKNESS) {
                current_ep += 2;
            }
            */

            if (weakness.length >= 2 || sigWeakness.length >= 1){
                current_ep += 2
            } else if (weakness.length == 1){
                current_ep += 1
            }

            console.log(sigWeakness);
            console.log(weakness);


            //Invocations have 3 EP
            if (type == INVOCATION) {
                current_ep += 3;
                return current_ep;
            }


            //Get EP from item strength
            if (strength == WEAK) {
                current_ep += 3
            } else if (strength == NORMAL) {
                current_ep += 2
            } else {
                current_ep += 0;
            }

            if (type == ITEM) {
                return current_ep += 1;
            } else {
                return current_ep;
            }

        }


        /**
         * ltterates through a given list of elements and finds their total EP cost
         * 
         *@returns {number} equal to the total EP cost of the effects in the elements
         */
        function getTotalEpCost(elements) {
            //todo: Implement



            //get Powerful value
            const powerful_inputs = document.getElementsByName("powerful");
            const versatile_inputs = document.getElementsByName("versatile");
            const consistent_inputs = document.getElementsByName("consistent");
            const rebate_inputs = document.getElementsByName("rebate")

            var powerful_value = 0;

            //Get EP cost of Powerful
            powerful_inputs.forEach(element => {
                powerful_value += Number(element.value);
            });


            //Get EP cost of Versatile
            var versatile_value = 0;

            versatile_inputs.forEach(element => {
                versatile_value += Number(element.value);
            });

            rebate_value = 0;
            //Get EP discount from rebates
            rebate_inputs.forEach(element => {
                rebate_value += Number(element.value);
            });


            //Get EP cost of Consistent
            var consistent_value = 0;

            consistent_inputs.forEach(element => {
                if (element.checked) {
                    consistent_value++;
                }
            });



            return powerful_value + versatile_value + consistent_value - rebate_value;

        }
        /**
         * Gets the final EP cost and amount of EP that can be spent, and returns this information as a string
         * 
         * @returns {string} in the form of <total cost>/<total budget>
         */
        function getFinalPricing({ strength, type, weakness, sigWeakness, gimmick, ace, elements }) {

            return getTotalEpCost(elements) + "/" + getEpBudget({ strength: strength, type: type, weakness: weakness, sigWeakness:sigWeakness, gimmick: gimmick, ace: ace });
        }

        /**
         * Edits finalCostDisplay to show the cost of all effects and the avalible budget.
         */
        calculateButton.addEventListener('click', () => {
            const selected_strength = document.querySelector('input[name=card_strength]:checked').value;
            const selected_type = document.querySelector('input[name=card_type]:checked').value;
            //const selected_weeakness = document.querySelector('input[name=weakness]:checked').value;
            const normalWeaknesses = document.querySelectorAll('#weakness:checked');
            const significantWeaknesses = document.querySelectorAll('#sig_weakness:checked');
            const gimmick_used = document.getElementById('gimmick').checked;
            const ace_used = document.getElementById("ace").checked;

            const finalCostDisplay = document.getElementById("finalCost");

            //Create pricing data object to send top getEPBudget
            var pricing_data = {
                strength: selected_strength,
                type: selected_type,
                weakness: normalWeaknesses,
                sigWeakness: significantWeaknesses,
                gimmick: gimmick_used,
                ace: ace_used
            }

            console.log(pricing_data)
            console.log("Current EP = " + getEpBudget(pricing_data))



            finalCostDisplay.textContent = getFinalPricing(pricing_data);

        });


        /**
         * Create a new effect when the add effect button is clicked. This is added to the bottom of the baseLayer.
         */
        addEffectButton.addEventListener("click", () => {
            labelNumber++;

            const baseLayer = document.getElementById("baseLayer"); //The element that holds all of the data. This is used so we can have boxes around all elements.

            

            //TODO: Add way to remove an effect

            const newEffectDiv = document.createElement("div"); //This is the element that holds the new effect.


            newEffectDiv.textContent = "Effect";
            newEffectDiv.id = "wrap"

            //Create Powerful Element
            powerDiv = document.createElement("div");
            powerDiv.textContent = "Powerful: "
            var powerInput = document.createElement("input");
            powerInput.placeholder = "Powerful"
            powerInput.type = "number"
            powerInput.name = "powerful"
            powerInput.value = 0

            powerDiv.appendChild(powerInput);
            newEffectDiv.appendChild(powerDiv);


            //Create Versitile Element
            versatileDiv = document.createElement("div");
            versatileDiv.textContent = "Versatile: "
            var versatileInput = document.createElement("input");
            versatileInput.placeholder = "Versatile"
            versatileInput.type = "number"
            versatileInput.name = "versatile"
            versatileInput.value = 0

            versatileDiv.appendChild(versatileInput);
            newEffectDiv.appendChild(versatileDiv);


            //Create Rebate Element
            rebateDiv = document.createElement("div");
            rebateDiv.textContent = "Rebate: "
            var rebateInput = document.createElement("input");
            rebateInput.placeholder = "Rebate"
            rebateInput.type = "number"
            rebateInput.name = "rebate"
            rebateInput.value = 0

            rebateDiv.appendChild(rebateInput);
            newEffectDiv.appendChild(rebateDiv);


            //Create consistent element
            consistentDiv = document.createElement("div");
            consistentDiv.textContent = "Consistent: "
            var consistentInput = document.createElement("input");
            consistentInput.placeholder = "Versatile"
            consistentInput.type = "checkbox" //This is a checkbox because consistent is a boolean in this system.
            consistentInput.name = "consistent"

            consistentDiv.appendChild(consistentInput);
            newEffectDiv.appendChild(consistentDiv);


            //Create Weakness element
            const weaknessDiv = document.createElement("div");
            weaknessDiv.textContent = "Weakness: "
            

            //No Weakness
            const noWeaknessInput = document.createElement("input");
            noWeaknessInput.type = "radio";
            noWeaknessInput.id = NO_WEAKNESS;
            noWeaknessInput.name = "weakness" + labelNumber;
            noWeaknessInput.value = NO_WEAKNESS
            noWeaknessInput.checked = true;

            const noWeaknessLabel = document.createElement("label");
            noWeaknessLabel.htmlFor = noWeaknessInput.id;
            noWeaknessLabel.innerText = "No Weakness"

            weaknessDiv.appendChild(noWeaknessInput);
            weaknessDiv.appendChild(noWeaknessLabel);
            
            
            
            //Standard Weakness
            const weaknessInput = document.createElement("input");
            weaknessInput.type = "radio";
            weaknessInput.id = WEAKNESS;
            weaknessInput.name = "weakness" + labelNumber;
            weaknessInput.value = WEAKNESS
            weaknessInput.checked = false;

            const weaknessLabel = document.createElement("label");
            weaknessLabel.htmlFor = weaknessInput.id;
            weaknessLabel.innerText = "Weakness"

            weaknessDiv.appendChild(weaknessInput);
            weaknessDiv.appendChild(weaknessLabel);
            
            
            
            
            //Signifigant Weakness
            const sigWeaknessInput = document.createElement("input");
            sigWeaknessInput.type = "radio";
            sigWeaknessInput.id = SIG_WEAKNESS;
            sigWeaknessInput.name = "weakness" + labelNumber;
            sigWeaknessInput.value = SIG_WEAKNESS;
            sigWeaknessInput.checked = false;

            const sigWeaknessLabel = document.createElement("label");
            sigWeaknessLabel.htmlFor = sigWeaknessInput.id;
            sigWeaknessLabel.innerText = "Significant Weakness"

            
            weaknessDiv.appendChild(sigWeaknessInput);
            weaknessDiv.appendChild(sigWeaknessLabel);
            
            
            
            
            
            
            newEffectDiv.appendChild(weaknessDiv);



            

            /*
            var consistentInput = document.createElement("input");
            consistentInput.placeholder = "Versatile"
            consistentInput.type = "checkbox" //This is a checkbox because consistent is a boolean in this system.
            consistentInput.name = "consistent"
            */

            consistentDiv.appendChild(consistentInput);
            newEffectDiv.appendChild(consistentDiv);

            //Create effect text. This will not be sent anywhere, it is just visual so we can see what effect is being priced.
            effectTextDiv = document.createElement("div");
            effectTextDiv.textContent = "Effect Text: "

            var effectText = document.createElement("textarea");
            effectText.style.fieldSizing = 'content'; //Attempts to make the effect box scale to the effect text.
            effectText.placeholder = "Insert text of your effect here"
            effectText.wrap = "soft"
            effectText.style.maxWidth = "50%";
            effectText.style.boxSizing = "border-box"
            effectText.style.resize = "vertical"

            effectTextDiv.appendChild(effectText);
            newEffectDiv.appendChild(effectTextDiv)

            //document.body.appendChild(newEffectDiv); //For appending to the entire document
            baseLayer.appendChild(newEffectDiv); //For appending to the base layer.

        });
    </script>
</body>

</html>
